<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Space Invaders</title>
  <style>
    body { margin: 0; background: #101020; color: white; font-family: Arial, sans-serif; text-align: center; }
    canvas { background: #080814; border: 2px solid #6cf; max-width: 95vw; margin-top: 10px; }
    p { color: #bbb; }
  </style>
</head>
<body>
  <h1>Space Invaders</h1>
  <p>Move: ← → or A / D &nbsp; | &nbsp; Shoot: Space &nbsp; | &nbsp; Restart: R</p>
  <p>Two rounds · Five hearts · Each escaped plane costs one heart</p>
  <canvas id="game" width="480" height="560"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const sprites = {};
    function loadSprite(name, path) {
      const playerImage = new Image();
      playerImage.onload = () => {
        const sprite = document.createElement('canvas');
        sprite.width = playerImage.naturalWidth;
        sprite.height = playerImage.naturalHeight;
        const spriteCtx = sprite.getContext('2d');
        spriteCtx.drawImage(playerImage, 0, 0);
        const pixels = spriteCtx.getImageData(0, 0, sprite.width, sprite.height);
        const data = pixels.data;
        const visited = new Uint8Array(sprite.width * sprite.height);
        const pending = [];
        // Only remove pale background connected to the edges, preserving the white hull.
        function visit(index) {
          if (visited[index]) return;
          visited[index] = 1;
          const offset = index * 4;
          if (data[offset] > 210 && data[offset + 1] > 210 && data[offset + 2] > 210) {
            data[offset + 3] = 0;
            pending.push(index);
          }
        }
        for (let x = 0; x < sprite.width; x++) {
          visit(x);
          visit((sprite.height - 1) * sprite.width + x);
        }
        for (let y = 0; y < sprite.height; y++) {
          visit(y * sprite.width);
          visit(y * sprite.width + sprite.width - 1);
        }
        while (pending.length) {
          const index = pending.pop();
          const x = index % sprite.width;
          if (x > 0) visit(index - 1);
          if (x < sprite.width - 1) visit(index + 1);
          if (index >= sprite.width) visit(index - sprite.width);
          if (index < sprite.width * (sprite.height - 1)) visit(index + sprite.width);
        }
        spriteCtx.putImageData(pixels, 0, 0);
        let left = sprite.width, top = sprite.height, right = 0, bottom = 0;
        for (let y = 0; y < sprite.height; y++) {
          for (let x = 0; x < sprite.width; x++) {
            if (data[(y * sprite.width + x) * 4 + 3]) {
              left = Math.min(left, x); top = Math.min(top, y);
              right = Math.max(right, x); bottom = Math.max(bottom, y);
            }
          }
        }
        sprites[name] = { image: sprite, x: left, y: top, w: right - left + 1, h: bottom - top + 1 };
      };
      playerImage.onerror = () => console.error('Could not load plane asset:', path);
      playerImage.src = path;
    }
    loadSprite('player', './Pixel-Art Blue Delta Fighter.png');
    loadSprite('enemy', './Red and White Pixel Spaceship.png');
    const keys = {};
    const rounds = [
      { total: 12, speed: 65, interval: 1.05 },
      { total: 20, speed: 110, interval: 0.65 }
    ];
    let player, bullets, enemies, score, gameOver, won, lastShot;
    let hearts, round, spawned, spawnTimer, transition, damageFlash;
    let explosions = [], previousTime;

    function startRound(number) {
      round = number;
      enemies = [];
      bullets = [];
      spawned = 0;
      spawnTimer = 0.4;
      transition = 0;
    }

    function reset() {
      player = { x: 214, y: 493, w: 52, h: 56, speed: 300 };
      explosions = [];
      previousTime = undefined;
      score = 0;
      hearts = 5;
      damageFlash = 0;
      gameOver = false;
      won = false;
      lastShot = -Infinity;
      for (const key in keys) delete keys[key];
      startRound(1);
    }

    document.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'KeyR') reset();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const key in keys) delete keys[key]; });

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function explode(ship) {
      const particles = [];
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 135;
        particles.push({
          x: 0, y: 0,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color: ['#fff4b0', '#ffbd4a', '#ff7043', '#ff628c'][i % 4]
        });
      }
      explosions.push({ x: ship.x + ship.w / 2, y: ship.y + ship.h / 2, age: 0, particles });
    }

    function updateExplosions(dt) {
      for (const explosion of explosions) {
        explosion.age += dt;
        for (const p of explosion.particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 90 * dt;
        }
      }
      explosions = explosions.filter(explosion => explosion.age < 0.6);
    }

    function update(time, dt) {
      damageFlash = Math.max(0, damageFlash - dt);
      if (gameOver) return;
      if (transition > 0) {
        transition -= dt;
        if (transition <= 0) startRound(2);
        return;
      }
      if (keys.ArrowLeft || keys.KeyA) player.x -= player.speed * dt;
      if (keys.ArrowRight || keys.KeyD) player.x += player.speed * dt;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      if (keys.Space && time - lastShot > 260) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
        lastShot = time;
      }
      const config = rounds[round - 1];
      spawnTimer -= dt;
      if (spawned < config.total && spawnTimer <= 0) {
        // Alternate lanes so each round covers the whole playing field.
        const lane = (spawned * 3 + Math.floor(spawned / 7)) % 7;
        enemies.push({ x: 20 + lane * 65, y: -42, w: 44, h: 38 });
        spawned++;
        spawnTimer += config.interval;
      }
      for (const bullet of bullets) bullet.y -= 440 * dt;
      for (const enemy of enemies) enemy.y += config.speed * dt;
      for (const bullet of bullets) {
        for (const enemy of enemies) {
          if (!enemy.dead && hit(bullet, enemy)) {
            bullet.dead = true;
            enemy.dead = true;
            explode(enemy);
            score += 10;
            break;
          }
        }
      }
      for (const enemy of enemies) {
        if (!enemy.dead && (enemy.y >= canvas.height || hit(enemy, player))) {
          enemy.dead = true;
          hearts = Math.max(0, hearts - 1);
          damageFlash = 0.25;
          if (hit(enemy, player)) explode(enemy);
          if (hearts === 0) { gameOver = true; break; }
        }
      }
      bullets = bullets.filter(b => !b.dead && b.y + b.h > 0);
      enemies = enemies.filter(e => !e.dead);
      if (!gameOver && spawned === config.total && enemies.length === 0) {
        if (round === 1) transition = 2;
        else { won = true; gameOver = true; }
      }
    }

    function drawPlane(name, ship, facingDown = false) {
      const sprite = sprites[name];
      ctx.save();
      ctx.translate(ship.x + ship.w / 2, ship.y + ship.h / 2);
      if (facingDown) ctx.rotate(Math.PI);
      if (sprite) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprite.image, sprite.x, sprite.y, sprite.w, sprite.h,
          -ship.w / 2, -ship.h / 2, ship.w, ship.h);
      } else {
        ctx.fillStyle = name === 'player' ? '#35baff' : '#ff4560';
        ctx.beginPath();
        ctx.moveTo(0, -ship.h / 2);
        ctx.lineTo(ship.w / 2, ship.h / 2);
        ctx.lineTo(0, ship.h / 4);
        ctx.lineTo(-ship.w / 2, ship.h / 2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPlane('player', player);
      ctx.fillStyle = '#ffe16b';
      for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
      for (const e of enemies) drawPlane('enemy', e, true);
      // Keep the HUD readable as enemies enter from the top.
      ctx.fillStyle = '#101020';
      ctx.fillRect(0, 0, canvas.width, 62);
      ctx.fillStyle = '#fff';
      ctx.font = '18px Arial';
      ctx.fillText('Score: ' + score, 15, 25);
      ctx.textAlign = 'right';
      ctx.fillText('Round ' + round + ' / 2', canvas.width - 15, 25);
      ctx.textAlign = 'left';
      ctx.font = '24px Arial';
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i < hearts ? '#ff628c' : '#454558';
        ctx.fillText(i < hearts ? '♥' : '♡', 15 + i * 27, 52);
      }
      ctx.fillStyle = '#a8b5cf';
      ctx.font = '13px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(round === 1 ? 'Easy · 12 planes' : 'Hard · 20 planes', canvas.width - 15, 49);
      ctx.textAlign = 'left';
      if (damageFlash > 0) {
        ctx.fillStyle = 'rgba(255, 65, 95, ' + damageFlash * 0.6 + ')';
        ctx.fillRect(0, 62, canvas.width, canvas.height - 62);
      }
      if (transition > 0) {
        ctx.fillStyle = 'rgba(8, 8, 20, 0.8)';
        ctx.fillRect(0, 180, canvas.width, 145);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = '28px Arial';
        ctx.fillText('ROUND 1 COMPLETE', canvas.width / 2, 230);
        ctx.font = '17px Arial';
        ctx.fillText('Round 2: faster planes, more enemies!', canvas.width / 2, 270);
        ctx.textAlign = 'left';
      }

      for (const explosion of explosions) {
        const progress = explosion.age / 0.6;
        ctx.save();
        ctx.translate(explosion.x, explosion.y);
        // A quick bright flash and expanding shockwave lead into fading debris.
        if (explosion.age < 0.15) {
          ctx.globalAlpha = 1 - explosion.age / 0.15;
          ctx.fillStyle = '#fff4b0';
          ctx.beginPath();
          ctx.arc(0, 0, 8 + explosion.age * 80, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1 - progress;
        ctx.strokeStyle = '#ffbd4a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 5 + progress * 35, 0, Math.PI * 2);
        ctx.stroke();
        for (const p of explosion.particles) {
          ctx.fillStyle = p.color;
          const size = p.size * (1 - progress);
          ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
        }
        ctx.restore();
      }

      if (gameOver && explosions.length === 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '26px Arial';
        ctx.fillText(won ? 'BOTH ROUNDS COMPLETE!' : 'GAME OVER', canvas.width / 2, 250);
        ctx.font = '18px Arial';
        ctx.fillText('Press R to restart', canvas.width / 2, 290);
        ctx.textAlign = 'left';
      }
    }

    function loop(time) {
      const dt = previousTime === undefined ? 0 : Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;
      updateExplosions(dt);
      update(time, dt);
      draw();
      requestAnimationFrame(loop);
    }
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
