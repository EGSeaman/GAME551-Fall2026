<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Space Invaders</title>
  <style>
    body { margin: 0; background: #101020; color: white; font-family: Arial, sans-serif; text-align: center; }
    canvas { background: #080814; border: 2px solid #6cf; max-width: 95vw; margin-top: 10px; }
    p { color: #bbb; }
  </style>
</head>
<body>
  <h1>Space Invaders</h1>
  <p>Move: ← → or A / D &nbsp; | &nbsp; Shoot: Space &nbsp; | &nbsp; Restart: R</p>
  <canvas id="game" width="480" height="560"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let playerSprite;
    const playerImage = new Image();
    playerImage.onload = () => {
      const sprite = document.createElement('canvas');
      sprite.width = playerImage.naturalWidth;
      sprite.height = playerImage.naturalHeight;
      const spriteCtx = sprite.getContext('2d');
      spriteCtx.drawImage(playerImage, 0, 0);
      const pixels = spriteCtx.getImageData(0, 0, sprite.width, sprite.height);
      const data = pixels.data;
      const visited = new Uint8Array(sprite.width * sprite.height);
      const pending = [];
      // Only remove pale background connected to the edges, preserving the white hull.
      function visit(index) {
        if (visited[index]) return;
        visited[index] = 1;
        const offset = index * 4;
        if (data[offset] > 210 && data[offset + 1] > 210 && data[offset + 2] > 210) {
          data[offset + 3] = 0;
          pending.push(index);
        }
      }
      for (let x = 0; x < sprite.width; x++) {
        visit(x);
        visit((sprite.height - 1) * sprite.width + x);
      }
      for (let y = 0; y < sprite.height; y++) {
        visit(y * sprite.width);
        visit(y * sprite.width + sprite.width - 1);
      }
      while (pending.length) {
        const index = pending.pop();
        const x = index % sprite.width;
        if (x > 0) visit(index - 1);
        if (x < sprite.width - 1) visit(index + 1);
        if (index >= sprite.width) visit(index - sprite.width);
        if (index < sprite.width * (sprite.height - 1)) visit(index + sprite.width);
      }
      spriteCtx.putImageData(pixels, 0, 0);
      playerSprite = sprite;
    };
    playerImage.src = 'Assets/Pixel Art Fighter Ship.png';
    const keys = {};
    let player, bullets, enemies, direction, score, gameOver, won, lastShot;
    let explosions = [], previousTime;

    function reset() {
      player = { x: 212, y: 500, w: 56, h: 50, speed: 5 };
      bullets = [];
      enemies = [];
      explosions = [];
      previousTime = undefined;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 8; col++) {
          enemies.push({ x: 40 + col * 50, y: 65 + row * 44, w: 30, h: 22 });
        }
      }
      direction = 1;
      score = 0;
      gameOver = false;
      won = false;
      lastShot = 0;
    }

    document.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'KeyR') reset();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function explode(ship) {
      const particles = [];
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 135;
        particles.push({
          x: 0, y: 0,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color: ['#fff4b0', '#ffbd4a', '#ff7043', '#ff628c'][i % 4]
        });
      }
      explosions.push({ x: ship.x + ship.w / 2, y: ship.y + ship.h / 2, age: 0, particles });
    }

    function updateExplosions(dt) {
      for (const explosion of explosions) {
        explosion.age += dt;
        for (const p of explosion.particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 90 * dt;
        }
      }
      explosions = explosions.filter(explosion => explosion.age < 0.6);
    }

    function update(time) {
      if (gameOver) return;
      if (keys.ArrowLeft || keys.KeyA) player.x -= player.speed;
      if (keys.ArrowRight || keys.KeyD) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      if (keys.Space && time - lastShot > 260) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
        lastShot = time;
      }
      for (const bullet of bullets) bullet.y -= 7;
      bullets = bullets.filter(b => b.y + b.h > 0);

      const speed = 0.6 + score * 0.012;
      if (enemies.some(e => e.x + direction * speed < 5 || e.x + e.w + direction * speed > canvas.width - 5)) {
        direction *= -1;
        for (const e of enemies) e.y += 18;
      }
      for (const e of enemies) {
        e.x += direction * speed;
        if (e.y + e.h >= player.y || hit(e, player)) gameOver = true;
      }

      for (const bullet of bullets) {
        for (const enemy of enemies) {
          if (!enemy.dead && hit(bullet, enemy)) {
            bullet.dead = true;
            enemy.dead = true;
            explode(enemy);
            score += 10;
            break;
          }
        }
      }
      bullets = bullets.filter(b => !b.dead);
      enemies = enemies.filter(e => !e.dead);
      if (enemies.length === 0) { won = true; gameOver = true; }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('Score: ' + score, 15, 30);

      if (playerSprite) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(playerSprite, 184, 230, 886, 793, player.x, player.y, player.w, player.h);
      } else {
        ctx.fillStyle = '#56f0bd';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillRect(player.x + player.w / 2 - 4, player.y - 9, 8, 9);
      }

      ctx.fillStyle = '#ffe16b';
      for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

      ctx.fillStyle = '#ff628c';
      for (const e of enemies) {
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#080814';
        ctx.fillRect(e.x + 7, e.y + 7, 4, 4);
        ctx.fillRect(e.x + 19, e.y + 7, 4, 4);
        ctx.fillStyle = '#ff628c';
      }

      for (const explosion of explosions) {
        const progress = explosion.age / 0.6;
        ctx.save();
        ctx.translate(explosion.x, explosion.y);
        // A quick bright flash and expanding shockwave lead into fading debris.
        if (explosion.age < 0.15) {
          ctx.globalAlpha = 1 - explosion.age / 0.15;
          ctx.fillStyle = '#fff4b0';
          ctx.beginPath();
          ctx.arc(0, 0, 8 + explosion.age * 80, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1 - progress;
        ctx.strokeStyle = '#ffbd4a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 5 + progress * 35, 0, Math.PI * 2);
        ctx.stroke();
        for (const p of explosion.particles) {
          ctx.fillStyle = p.color;
          const size = p.size * (1 - progress);
          ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
        }
        ctx.restore();
      }

      if (gameOver && explosions.length === 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '32px Arial';
        ctx.fillText(won ? 'YOU WIN!' : 'GAME OVER', canvas.width / 2, 250);
        ctx.font = '18px Arial';
        ctx.fillText('Press R to restart', canvas.width / 2, 290);
        ctx.textAlign = 'left';
      }
    }

    function loop(time) {
      const dt = previousTime === undefined ? 0 : Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;
      updateExplosions(dt);
      update(time);
      draw();
      requestAnimationFrame(loop);
    }
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
